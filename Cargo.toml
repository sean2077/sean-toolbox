[workspace]
members = ["crates/toolbox-core", "crates/toolbox-ipc", "crates/toolbox-projects", "crates/toolbox-windows", "crates/toolbox-host", "crates/toolbox-ui"]
exclude = ["vendor/global-hotkey"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/sean2077/sean-toolbox"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tempfile = "3.27.0"
libc = "0.2"
windows-sys = "0.61.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
url = "2.5.8"

[patch.crates-io]
global-hotkey = { path = "vendor/global-hotkey" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 2
strip = "symbols"
