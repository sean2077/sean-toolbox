[package]
name = "toolbox-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "sean-toolbox-ui"
path = "src/main.rs"

[dependencies]
toolbox-core = { path = "../toolbox-core" }
toolbox-ipc = { path = "../toolbox-ipc" }
toolbox-projects = { path = "../toolbox-projects" }
serde_json.workspace = true
tempfile.workspace = true
log = "0.4"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[build-dependencies]
slint-build = "=1.18.1"
cc = "=1.10.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", default-features = false }
