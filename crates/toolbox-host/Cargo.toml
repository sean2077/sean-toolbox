[package]
name = "toolbox-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sean-toolbox"
path = "src/main.rs"

[dependencies]
toolbox-core = { path = "../toolbox-core" }
toolbox-ipc = { path = "../toolbox-ipc" }
toolbox-windows = { path = "../toolbox-windows" }
serde_json.workspace = true
tempfile.workspace = true
global-hotkey = "=0.9.0"
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
